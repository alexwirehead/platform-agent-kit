[project]
name = "platform-agent-kit"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "shellcheck-py>=0.11.0.1",
]

# Только инструменты разработки кита (решение К10): тесты установщика и линтеры.
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
include = ["*.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
